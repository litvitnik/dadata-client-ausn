plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '1.2.0'
    id 'signing'
}

apply from: 'gradle/publish.gradle'

group = 'com.github.kuliginstepan'
version = '4.0.1'
sourceCompatibility = JavaVersion.VERSION_17

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

configurations {
    internal {
        visible = false
        canBeConsumed = false
        canBeResolved = false
    }
    annotationProcessor {
        extendsFrom(internal)
    }
    testAnnotationProcessor {
        extendsFrom(internal)
    }
    compileClasspath {
        extendsFrom(internal)
    }
    runtimeClasspath {
        extendsFrom(internal)
    }
    testCompileClasspath {
        extendsFrom(internal)
    }
    testRuntimeClasspath {
        extendsFrom(internal)
    }
}

dependencies {
    internal platform('org.springframework.boot:spring-boot-dependencies:3.0.4')
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-webflux'
    implementation 'io.projectreactor.netty:reactor-netty'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.slf4j:slf4j-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.validator:hibernate-validator'

    compileOnly 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

publishing {
    publications {
        dadataclient(MavenPublication) {
            artifactId = "dadata-client"
            version = version  // или version = project.version
            //from components.java
            artifact jar

            suppressPomMetadataWarningsFor('signing')
        }
    }

    repositories {
        maven {
            name = "fintech"
            url = System.getenv("FINTECH_MAVEN_URL")
            credentials {
                username = System.getenv("FINTECH_MAVEN_LOGIN")
                password = System.getenv("FINTECH_MAVEN_PASSWORD")
            }
        }
    }
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
    }
}

// Явно отключаем задачи подписи
tasks.withType(Sign) {
    onlyIf { false }
}

// ИЛИ отключаем конкретную задачу
tasks.named('signMavenPublication') {
    enabled = false
}


test.finalizedBy jacocoTestReport
